<section>
    <h3>{{tipo}} Usuario</h3>
    <hr>
    <form class="card shadow p-4" [formGroup]="userForm" (ngSubmit)="getDataForm()">
        <div class="mt-3">
            <label for="first_name" class="form-label">Nombre:</label>
            <input type="text" id="first_name" class="form-control" formControlName="first_name">
        </div>

        <div class="mt-3">
            <label for="last_name" class="form-label">Apellido:</label>
            <input type="text" id="last_name" class="form-control" formControlName="last_name">
        </div>
        <div class="mt-3">
            <label for="username" class="form-label">Usuario:</label>
            <input type="text" id="username" class="form-control" formControlName="username">
        </div>

        <div class="mt-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="text" id="email" class="form-control" formControlName="email">
            @if(camposRequeridos('email', 'required')){
            }
        </div>

        <div class="mt-3">
            <label for="image" class="form-label">Imagen</label>
            <input type="text" id="image" class="form-control" formControlName="image">
            @if(camposRequeridos('image', 'required')){
            }
        </div>

        <div class="mt-3">
            <label for="password" class="form-label">Password</label>
            <input type="text" id="password" class="form-control" formControlName="password">
        </div>

        <div class="d-flex gap-2 mt-4">
            <input type="submit" value="{{tipo}}" class="btn bg-danger" [disabled]="!userForm.valid">
        </div>
    </form>
</section>
